name: FEAT-79 visual and responsive smoke tests
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/feat79-visual.yml'
  workflow_dispatch:

jobs:
  responsive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/audit-comments.mjs
      - run: npm install --no-save @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opes-visual-screenshots
          path: test-results/
          retention-days: 7
